name: release

# rest-mail.com releases itself when Email, explained changes. rest-mail-server
# publishes the guide's bundle whenever its main branch changes the guide
# (ghcr.io/rest-mail/email-explained, its email-explained.yml). This takes each
# newer one and releases the site with it: a v tag and its image, then a chart
# that deploys it. Run it by hand with "release" ticked to release main as it
# is, with or without a new bundle.
#
# main is protected and nothing here pushes to it. A release is one commit on
# top of main that only its v tag holds: the guide's bundle and the chart's
# versions, generated for that release. The tag's tree is exactly what shipped,
# and the next release reads the bundle and the chart's version from it
# (scripts/release.mjs).
#
# It pushes the tag with this workflow's own token, which starts no workflow by
# itself, so it runs build.yml and chart.yml at the tag and waits for each. The
# site is typechecked, built and tested with the bundle, and the chart rendered,
# before anything is pushed, and anything red stops it there.
#
# The last step, antimatter-vps deploying the new chart, is the owner's agent's
# on purpose: no pipeline holds a credential that can deploy
# (rest-mail/rest-mail-server#826).

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      release:
        description: Release main even if there is no newer guide bundle
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Take the guide's bundle, and release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags and history, to work out the next version.
          fetch-depth: 0

      # Main keeps the copy it last had; the last release's bundle is on its tag.
      # Whatever goes out next starts from that, never from an older guide.
      - name: Start from the bundle the last release shipped
        run: node scripts/release.mjs shipped

      # Needs only Node and tar, so it runs before anything is installed, and
      # most runs end here.
      - name: Take a newer guide bundle
        id: bundle
        run: node scripts/take-bundle.mjs

      - name: Decide whether to release
        id: plan
        env:
          TAKEN: ${{ steps.bundle.outputs.taken }}
          ASKED: ${{ inputs.release || false }}
        run: |
          if [ "$TAKEN" = true ] || [ "$ASKED" = true ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "No newer guide bundle, and no release asked for."
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.plan.outputs.go == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Typecheck, build and test the site
        if: steps.plan.outputs.go == 'true'
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test

      - name: Work out the version
        id: version
        if: steps.plan.outputs.go == 'true'
        env:
          TAKEN: ${{ steps.bundle.outputs.taken }}
        run: |
          set -euo pipefail
          if [ "$TAKEN" = true ]; then
            next=$(node scripts/release.mjs next --new-bundle)
          else
            next=$(node scripts/release.mjs next)
          fi
          if [ -z "$next" ]; then
            echo "Nothing new since the last release."
            echo "next=" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing site $next."
            echo "next=$next" >> "$GITHUB_OUTPUT"
          fi

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: steps.version.outputs.next != ''
        with:
          version: v3.16.4

      - name: Make the release, and tag it
        id: chart
        if: steps.version.outputs.next != ''
        env:
          NEXT: ${{ steps.version.outputs.next }}
          BUNDLE: ${{ steps.bundle.outputs.version }}
        run: |
          set -euo pipefail
          chart=$(node scripts/release.mjs chart "$NEXT")
          charts/website/tests/render-test.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Off any branch: this commit is the tag's alone.
          git switch -q --detach
          git add content/email-explained public/email-explained charts/website/Chart.yaml
          git commit -q -m "chore(release): rest-mail.com $NEXT" \
            -m "The guide's bundle at $BUNDLE (ghcr.io/rest-mail/email-explained), chart $chart."
          git tag -a "v$NEXT" -m "rest-mail.com $NEXT"
          git push origin "refs/tags/v$NEXT"
          echo "chart=$chart" >> "$GITHUB_OUTPUT"

      - name: Publish its image
        if: steps.chart.outputs.chart != ''
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: scripts/dispatch-and-wait.sh build.yml "v$NEXT"

      - name: Publish its chart
        if: steps.chart.outputs.chart != ''
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: scripts/dispatch-and-wait.sh chart.yml "v$NEXT"

      - name: Say what is left
        if: steps.chart.outputs.chart != ''
        env:
          NEXT: ${{ steps.version.outputs.next }}
          CHART: ${{ steps.chart.outputs.chart }}
        run: |
          echo "::notice::Published site $NEXT and chart $CHART (oci://ghcr.io/rest-mail/charts/website). It goes live when the owner's agent moves antimatter-vps:restMailWebsite.chartVersion to $CHART (rest-mail/rest-mail-server#826)."
