name: Publish Helm chart

# The site is deployed from this chart, published to ghcr the way the image is.
# A deployment then names a version instead of keeping a copy of the chart that
# drifts from what this repository says.
#
#   helm install website oci://ghcr.io/rest-mail/charts/website --version 0.1.0
#
# The chart version and the site are different things: version in Chart.yaml
# describes the templates, and the image tag says which build of the site they
# put on. Editing the site does not touch this chart.

on:
  pull_request:
    paths:
      - "charts/**"
      - ".github/workflows/chart.yml"
  push:
    branches: [master]
    paths:
      - "charts/**"
      - ".github/workflows/chart.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  CHART_DIR: charts/website
  # helm push appends the chart name, giving ghcr.io/rest-mail/charts/website.
  REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  publish:
    name: Package and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.16.4

      - name: Lint, and check the chart still renders
        run: ${{ env.CHART_DIR }}/tests/render-test.sh

      - name: Read the version the chart declares
        id: chart
        run: |
          set -euo pipefail
          version=$(awk '/^version:/ { print $2; exit }' "$CHART_DIR/Chart.yaml")
          test -n "$version" || { echo "::error::no version in $CHART_DIR/Chart.yaml" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "chart version $version"

      - name: Log in to ghcr
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Refuse to overwrite a published version
        # OCI will happily move a tag, which would change what a version means
        # for anyone who already installed it. A published version is final:
        # to publish again, say so by bumping the version.
        if: github.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.chart.outputs.version }}
        run: |
          set -euo pipefail
          if helm show chart "$REGISTRY/website" --version "$VERSION" > /dev/null 2>&1; then
            echo "::error::chart $VERSION is already published — bump version in $CHART_DIR/Chart.yaml" >&2
            exit 1
          fi
          echo "$VERSION is unpublished"

      - name: Package and push
        if: github.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.chart.outputs.version }}
        run: |
          set -euo pipefail
          helm package "$CHART_DIR" --destination "$RUNNER_TEMP"
          helm push "$RUNNER_TEMP/website-$VERSION.tgz" "$REGISTRY"
          echo "::notice::published $REGISTRY/website version $VERSION"
