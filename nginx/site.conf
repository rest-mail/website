# rest-mail.com: a few static files, served by an unprivileged nginx.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Apple fetches this to decide whether https://rest-mail.com/setup opens
    # the app instead of the browser. The file has no extension, so nginx has
    # to be told what it is.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
    }

    # A sign-in link's password travels after the `#`, which never reaches here,
    # and the page itself must not hand one anywhere either: no third-party
    # script is allowed to load on this site.
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        try_files $uri $uri/ =404;
    }
}
