services:
  website:
    # The image this repository publishes, built from the checkout: the site is
    # compiled inside it, so there is nothing to mount. `npm run dev` is the way
    # to edit with live reload.
    image: rest-mail-website:dev
    build:
      context: .
    environment:
      REST_MAIL_DESIGN: ${REST_MAIL_DESIGN:-experimental}
    restart: unless-stopped
    labels:
      - docker-proxy.website.host=restmail.localhost
      - docker-proxy.website.port=80
      - docker-proxy.website.path=/
    ports:
      - "8090:80"
    networks:
      mailnet:
        ipv4_address: 10.99.0.26

networks:
  mailnet:
    external: true
    name: ${COMPOSE_PROJECT_NAME:-rest-mail}_mailnet
