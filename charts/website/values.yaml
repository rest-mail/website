replicaCount: 2

# Which of the site's three designs is live: safe (Cobalt Editorial), bold
# (Acid Tabloid) or experimental (Magenta Zine). Every release of the site
# carries all three, so this is the only thing to change to switch; anyone
# can look at the others with ?design=safe and so on.
design: safe

image:
  repository: ghcr.io/rest-mail/website
  # Empty: the chart's appVersion, a SemVer release of the site. Set it to
  # deploy another release without a new chart.
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  # Every name the site answers to. The first is where it lives; the rest are
  # redirected to it by whoever terminates TLS, or simply serve the same files.
  hosts: []
  annotations: {}
  tls:
    enabled: false
    secretName: ""

resources:
  requests:
    cpu: 10m
    memory: 24Mi
  limits:
    memory: 96Mi

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
