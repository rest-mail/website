replicaCount: 2

# Which of the site's three designs is live: safe (Cobalt Editorial), bold
# (Acid Tabloid) or experimental (Magenta Zine). Every release of the site
# carries all three, so this is the only thing to change to switch; anyone
# can look at the others with ?design=safe and so on.
design: safe

# Where people write to the project, shown on /contact, /privacy and /security
# and in /.well-known/security.txt. An email address and nothing else.
contact: hello@rest-mail.com

image:
  repository: ghcr.io/rest-mail/website
  # Empty: the chart's appVersion, a SemVer release of the site. Set it to
  # deploy another release without a new chart.
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  # Every name the site answers to. The first is where it lives; the rest are
  # redirected to it by whoever terminates TLS, or simply serve the same files.
  hosts: []
  annotations: {}
  tls:
    enabled: false
    secretName: ""

# The site is a Node server that renders each page: it idles at about 75Mi
# and stays near 120Mi under load, with its heap capped in the image.
resources:
  requests:
    cpu: 10m
    memory: 128Mi
  limits:
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
