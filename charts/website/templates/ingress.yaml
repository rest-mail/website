{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.hosts }}
{{- fail "website: ingress.enabled needs ingress.hosts — the names the site answers to" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "website.fullname" . }}
  labels:
    {{- include "website.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        {{- toYaml .Values.ingress.hosts | nindent 8 }}
      secretName: {{ required "website: ingress.tls.enabled needs ingress.tls.secretName" .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "website.fullname" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
